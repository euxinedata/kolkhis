services:
  db:
    image: postgres:17
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/pontus-dev-iceberg &&
      exit 0
      "

  gitea-init:
    image: postgres:17
    depends_on:
      - db
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    entrypoint: >
      sh -c "until pg_isready -h db -U ${POSTGRES_USER}; do sleep 1; done &&
      psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tc \"SELECT 1 FROM pg_database WHERE datname = 'gitea'\" | grep -q 1 ||
      psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c \"CREATE DATABASE gitea\""
    restart: "no"

  gitea:
    image: gitea/gitea:1.24-rootless
    environment:
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=${POSTGRES_USER}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD}
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__server__DISABLE_SSH=true
      - GITEA__server__ROOT_URL=http://localhost:3000
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__actions__ENABLED=true
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      - gitea-init
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea

  gitea-setup:
    image: gitea/gitea:1.23-rootless
    depends_on:
      - gitea
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    entrypoint: >
      sh -c "sleep 10 &&
      gitea admin user list --admin 2>/dev/null | grep -q kolkhis-admin && exit 0;
      gitea admin user create --username ${GITEA_ADMIN_USER:-kolkhis-admin} --password ${GITEA_ADMIN_PASSWORD:-kolkhis-dev-2026} --email ${GITEA_ADMIN_EMAIL:-admin@kolkhis.local} --admin"
    restart: "no"

  gitea-runner:
    image: gitea/act_runner:latest
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN}
      - GITEA_RUNNER_NAME=local-runner
      - CONFIG_FILE=/config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/gitea-runner/config.yaml:/config.yaml
    depends_on:
      - gitea

  shell:
    build: ./shell
    ports:
      - "2222:22"
    volumes:
      - ./backend/data/homes/${SHELL_ORG_UUID}:/home

  dagster-init:
    image: postgres:17
    depends_on:
      - db
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    entrypoint: >
      sh -c "until pg_isready -h db -U ${POSTGRES_USER}; do sleep 1; done &&
      psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tc \"SELECT 1 FROM pg_database WHERE datname = 'dagster'\" | grep -q 1 ||
      psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c \"CREATE DATABASE dagster\""
    restart: "no"

  dagster-code:
    build: ./docker/dagster
    environment:
      - DAGSTER_PG_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/dagster
      - DAGSTER_HOME=/opt/dagster
      - GITEA_SHELL_URL=${GITEA_SHELL_URL:-http://gitea:3000}
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-kolkhis-admin}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD:-kolkhis-dev-2026}
      - DAGSTER_RELOAD_TOKEN=${DAGSTER_RELOAD_TOKEN:-dagster-reload-dev}
      - SHELL_BACKEND_URL=${SHELL_BACKEND_URL:-http://host.docker.internal:8000}
    ports:
      - "3031:3031"
    volumes:
      - ./docker/dagster/dagster-local.yaml:/opt/dagster/dagster.yaml
    depends_on:
      - dagster-init

  dagster-webserver:
    build: ./docker/dagster
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/workspace.yaml"]
    ports:
      - "3030:3000"
    environment:
      - DAGSTER_PG_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/dagster
      - DAGSTER_HOME=/opt/dagster
    volumes:
      - ./docker/dagster/dagster-local.yaml:/opt/dagster/dagster.yaml
    depends_on:
      - dagster-code

  dagster-daemon:
    build: ./docker/dagster
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/workspace.yaml"]
    environment:
      - DAGSTER_PG_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/dagster
      - DAGSTER_HOME=/opt/dagster
    volumes:
      - ./docker/dagster/dagster-local.yaml:/opt/dagster/dagster.yaml
    depends_on:
      - dagster-code

volumes:
  pgdata:
  minio-data:
  gitea-data:
  gitea-config:
