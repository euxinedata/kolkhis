services:
  db:
    image: postgres:17
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      exit 0
      "

  gitea-init:
    image: postgres:17
    depends_on:
      - db
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    entrypoint: >
      sh -c "until pg_isready -h db -U ${POSTGRES_USER}; do sleep 1; done &&
      psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tc \"SELECT 1 FROM pg_database WHERE datname = 'gitea'\" | grep -q 1 ||
      psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c \"CREATE DATABASE gitea\""
    restart: "no"

  gitea:
    image: gitea/gitea:1.23-rootless
    environment:
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=${POSTGRES_USER}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD}
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__server__DISABLE_SSH=true
      - GITEA__server__ROOT_URL=http://localhost:3000
      - GITEA__service__DISABLE_REGISTRATION=true
    ports:
      - "3000:3000"
    depends_on:
      - gitea-init
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea

  gitea-setup:
    image: gitea/gitea:1.23-rootless
    depends_on:
      - gitea
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    entrypoint: >
      sh -c "sleep 10 &&
      gitea admin user list --admin 2>/dev/null | grep -q kolkhis-admin && exit 0;
      gitea admin user create --username ${GITEA_ADMIN_USER:-kolkhis-admin} --password ${GITEA_ADMIN_PASSWORD:-kolkhis-dev-2026} --email ${GITEA_ADMIN_EMAIL:-admin@kolkhis.local} --admin"
    restart: "no"

volumes:
  pgdata:
  minio-data:
  gitea-data:
  gitea-config:
