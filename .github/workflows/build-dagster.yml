name: Build Dagster

on:
  push:
    branches: [main]
    paths: ['docker/dagster/**']
  workflow_dispatch:

env:
  DAGSTER_IMAGE: ghcr.io/euxinedata/dagster

jobs:
  build-dagster:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "SHA=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and push dagster
        run: |
          docker build -t $DAGSTER_IMAGE:$SHA -t $DAGSTER_IMAGE:latest docker/dagster/
          docker push $DAGSTER_IMAGE:$SHA
          docker push $DAGSTER_IMAGE:latest
